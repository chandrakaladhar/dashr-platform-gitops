# Production on AWS EKS: credentials live in AWS Secrets Manager, read through
# IRSA (see "Production on AWS EKS" in the README).
# Before Flux: IAM roles for each namespace and the secrets exist in AWS.
# Then: namespaces, OPA -> secrets gate -> postgres -> temporal (and tenants).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-namespaces
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/namespaces
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-opa
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-namespaces
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/opa
  prune: true
  wait: true
---
# THE GATE: Ready only when every ExternalSecret has synced from Secrets Manager.
# Until the IAM roles and secrets exist this keeps retrying, and everything
# depending on it waits.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secrets/aws
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-postgres
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
    - name: platform-secrets
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/postgres
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-temporal
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-postgres
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/temporal
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
