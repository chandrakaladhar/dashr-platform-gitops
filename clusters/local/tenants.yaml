apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-secrets      # tenant credentials are synced
    - name: platform-postgres     # databases and roles exist
    - name: platform-temporal
    - name: platform-opa
    - name: infra-policies
  interval: 1h
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./tenants
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  patches:
    # Local only: corporate proxy (Zscaler) re-signs TLS for github.com.
    # Secret corp-ca (key ca.crt) is created by hand in each tenant namespace.
    - target:
        kind: GitRepository
      patch: |
        - op: add
          path: /spec/secretRef
          value:
            name: corp-ca
