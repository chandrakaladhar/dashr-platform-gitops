# Phase A: namespaces, OpenBao, OPA (no secrets needed)
# Phase B: manual, see README (init/unseal OpenBao, configure, seed)
# Phase C: secrets gate -> postgres -> temporal, keycloak (and tenants, see tenants.yaml)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-namespaces
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/namespaces
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-openbao
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-namespaces
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/openbao
  prune: true
  # No "wait": OpenBao is sealed until Phase B and must not block anything here.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-opa
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-namespaces
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/opa
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# THE GATE: Ready only when every ExternalSecret has synced from OpenBao.
# Until Phase B is done this keeps retrying, and everything depending on it waits.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
    - name: platform-openbao
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secrets/openbao
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-postgres
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
    - name: platform-secrets
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/postgres
  prune: true
  wait: true
  # "wait" alone is not enough: CNPG's Cluster and Database have no kstatus
  # conditions, so Flux would call them Ready as soon as they are applied, and
  # consumers (Keycloak, Temporal) could start before their database exists.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: "has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: "has(status.applied) && status.applied == true && status.observedGeneration == metadata.generation"
      failed: "has(status.applied) && status.applied == false && has(status.message)"
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-temporal
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-postgres
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/temporal
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-keycloak
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-namespaces   # istio-injection label must be on the namespace before the pod is created
    - name: platform-postgres     # healthy cluster, keycloak role and database exist (healthCheckExprs)
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/keycloak
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  patches:
    # Local only: Keycloak at http://localhost:8080 (keycloak_url). Any host
    # on gateway port 8080 goes to Keycloak; nothing else answers on 8080.
    # keycloak.<domain> on port 80 is no longer routed.
    - target:
        kind: VirtualService
        name: keycloak
      patch: |
        - op: replace
          path: /spec/hosts
          value: ["*"]
        - op: replace
          path: /spec/http
          value:
            - match:
                - port: 8080
              route:
                - destination:
                    host: keycloak.keycloak.svc.cluster.local
                    port: { number: 8080 }
