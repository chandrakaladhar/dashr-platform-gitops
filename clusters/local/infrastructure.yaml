apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  patches:
    # Local only: corporate proxy (Zscaler) re-signs TLS for some chart repos
    - target:
        kind: HelmRepository
      patch: |
        - op: add
          path: /spec/certSecretRef
          value:
            name: corp-ca
    # Local only: Keycloak on localhost:8080 (keycloak_url in cluster-vars).
    # Docker Desktop publishes LoadBalancer ports on localhost. Setting
    # service.ports replaces the chart's list, so its three defaults are kept.
    - target:
        kind: HelmRelease
        name: istio-ingress
      patch: |
        - op: add
          path: /spec/values
          value:
            service:
              ports:
                - { name: status-port, port: 15021, targetPort: 15021, protocol: TCP }
                - { name: http2, port: 80, targetPort: 80, protocol: TCP }
                - { name: https, port: 443, targetPort: 443, protocol: TCP }
                - { name: http-keycloak, port: 8080, targetPort: 8080, protocol: TCP }
    # Local only: sized for one developer machine, no high availability.
    # The charts' defaults are for production (istiod reserves 2Gi, Gatekeeper
    # runs 3 controller replicas at 512Mi), and Kubernetes schedules by what a
    # pod reserves, not what it uses. Production keeps the defaults.
    #
    # istiod: one replica, no autoscaler, a smaller reservation. Upgrades stop
    # the old pod before starting the new one (maxSurge 0), so an upgrade never
    # needs room for two; the mesh keeps running from the sidecars' config
    # meanwhile. Sidecars reserve 64Mi instead of 128Mi (limits unchanged).
    - target:
        kind: HelmRelease
        name: istiod
      patch: |
        - op: add
          path: /spec/values/pilot/autoscaleEnabled
          value: false
        - op: add
          path: /spec/values/pilot/replicaCount
          value: 1
        - op: add
          path: /spec/values/pilot/rollingMaxSurge
          value: 0
        - op: add
          path: /spec/values/pilot/rollingMaxUnavailable
          value: 1
        - op: add
          path: /spec/values/pilot/resources
          value:
            requests: { cpu: 100m, memory: 256Mi }
        - op: add
          path: /spec/values/global
          value:
            proxy:
              resources:
                requests: { cpu: 20m, memory: 64Mi }
    # Gatekeeper: one controller replica instead of three; 256Mi reserved for
    # the controller and audit pods instead of 512Mi (512Mi limits kept).
    - target:
        kind: HelmRelease
        name: gatekeeper
      patch: |
        - op: add
          path: /spec/values
          value:
            replicas: 1
            controllerManager:
              resources:
                requests: { cpu: 100m, memory: 256Mi }
            audit:
              resources:
                requests: { cpu: 100m, memory: 256Mi }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  patches:
    # Local only: a listener on 8080 for Keycloak at http://localhost:8080.
    # Istio rejects "localhost" as a Gateway host (not an FQDN), so this
    # server accepts any host; the Keycloak VirtualService is the only route
    # on port 8080 (it matches on the port).
    - target:
        kind: Gateway
        name: main-gateway
      patch: |
        - op: add
          path: /spec/servers/-
          value:
            port: { number: 8080, name: http-keycloak, protocol: HTTP }
            hosts: ["*"]
---
# Constraints need the CRDs that Gatekeeper creates from the templates in
# infra-configs, so they are applied in a separate, later step.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-policies
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/policies
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
