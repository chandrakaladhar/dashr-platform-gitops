# External Secrets Operator: syncs credentials from OpenBao into Kubernetes Secrets.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  releaseName: external-secrets
  targetNamespace: external-secrets
  install:
    createNamespace: true
  chart:
    spec:
      chart: external-secrets
      version: "*"   # TODO: pin; the external-secrets.io/v1 API needs ESO 0.17 or later
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  values:
    installCRDs: true
