apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cnpg
  targetNamespace: cnpg-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: cloudnative-pg
      version: "*"   # TODO: pin (operator >= 1.25 is needed for the Database CRD)
      sourceRef:
        kind: HelmRepository
        name: cnpg
