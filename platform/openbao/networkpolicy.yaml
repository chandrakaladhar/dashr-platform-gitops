# Only ESO (and OpenBao's own pods, for Raft) may reach OpenBao.
# kubectl port-forward for administration still works.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-access
  namespace: openbao
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
