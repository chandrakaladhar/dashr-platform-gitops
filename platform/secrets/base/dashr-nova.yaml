# Fulfils the dashr-nova chart contract: Secret dashr-nova-db, key DATABASE_URL.
# The host comes from cluster-vars (Flux substitutes ${pg_pooler_host} before
# ESO renders the {{ }} template), so the location stays a platform decision.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashr-nova-db
  namespace: dashr-nova
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform
  target:
    name: dashr-nova-db
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@${pg_pooler_host}:5432/dashr_nova"
  dataFrom:
    - extract:
        key: dashr-nova/db
