# Keycloak reads two Secrets in its namespace:
#   keycloak-db     username, password  (from keycloak/db, same entry CNPG uses)
#   keycloak-admin  username, password  (from keycloak/admin)
# keycloak-admin is the bootstrap admin, used only to create a real admin
# account on first start; Keycloak ignores it once the master realm has one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform
  target:
    name: keycloak-db
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: keycloak/db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform
  target:
    name: keycloak-admin
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: keycloak/admin
