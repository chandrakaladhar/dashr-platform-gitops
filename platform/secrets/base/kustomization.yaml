# Provider-neutral: which backend key goes into which Kubernetes Secret.
# Every ExternalSecret uses SecretStore "platform"; the store itself comes
# from stores/<provider>, chosen per cluster by ../openbao or ../aws.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database.yaml
  - temporal.yaml
  - dashr-nova.yaml
