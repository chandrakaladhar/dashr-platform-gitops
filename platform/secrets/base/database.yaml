# Role passwords read by CNPG (namespace: database). Each comes from the same
# OpenBao entry the consuming component reads, so the two can never drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-role-dashr-nova
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform
  target:
    name: pg-role-dashr-nova
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"    # CNPG applies password changes
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: dashr-nova/db
