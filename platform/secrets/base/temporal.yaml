# Temporal's chart reads the password from Secret temporal-db, key "password".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: temporal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform
  target:
    name: temporal-db
    template:
      data:
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: temporal/db
