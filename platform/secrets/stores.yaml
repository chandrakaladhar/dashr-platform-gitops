# One SecretStore per namespace. Each authenticates to OpenBao as its own
# service account, and the OpenBao role for that namespace only grants the
# paths it needs (see scripts/configure-openbao.sh). No static tokens anywhere.
#
# OpenBao layout (KV v2, mount "kv"):
#   kv/<component>/db   username, password   (one entry per database user)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: database
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: database
spec:
  provider:
    vault:                          # OpenBao is API-compatible with ESO's Vault provider
      server: ${openbao_addr}
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: ${openbao_auth_mount}
          role: database
          serviceAccountRef:
            name: external-secrets-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: temporal
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: temporal
spec:
  provider:
    vault:
      server: ${openbao_addr}
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: ${openbao_auth_mount}
          role: temporal
          serviceAccountRef:
            name: external-secrets-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: dashr-nova
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: dashr-nova
spec:
  provider:
    vault:
      server: ${openbao_addr}
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: ${openbao_auth_mount}
          role: dashr-nova
          serviceAccountRef:
            name: external-secrets-reader
