# One SecretStore per namespace. Each authenticates to AWS Secrets Manager with
# IRSA: ESO requests a token for the namespace's service account and exchanges
# it for that account's IAM role, which only grants the secrets the namespace
# needs (see "Production on AWS EKS" in the README). No static keys anywhere.
#
# Secrets Manager layout (one JSON secret per database user, same names as the
# OpenBao keys so the ExternalSecrets in ../../base work unchanged):
#   <component>/db   {"username": "...", "password": "..."}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: database
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${aws_account_id}:role/${eks_cluster_name}-eso-database
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform
  namespace: database
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${aws_region}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader
---
