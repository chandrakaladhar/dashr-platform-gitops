# Temporal on the shared Postgres. The password comes from Secret temporal-db
# (key "password"), synced from OpenBao by platform/secrets/temporal.yaml.
# Value names follow the temporalio/helm-charts layout; check them against the
# chart version you pin.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: temporal
spec:
  interval: 1h
  timeout: 15m
  releaseName: temporal
  chart:
    spec:
      chart: temporal
      version: "1.7.0"   # 1.x layout: persistence.datastores, no bundled sub-charts
      sourceRef:
        kind: HelmRepository
        name: temporal
        namespace: flux-system
  values:
    server:
      replicaCount: 1
      config:
        persistence:
          defaultStore: default
          visibilityStore: visibility
          datastores:
            default:
              sql:
                createDatabase: false   # databases are provisioned by CNPG
                manageSchema: true      # chart runs schema setup/update jobs
                pluginName: postgres12
                driverName: postgres12
                databaseName: temporal
                connectAddr: "${pg_host}:5432"
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-db
                secretKey: password
                maxConns: 20
                maxIdleConns: 20
            visibility:
              sql:
                createDatabase: false
                manageSchema: true
                pluginName: postgres12
                driverName: postgres12
                databaseName: temporal_visibility
                connectAddr: "${pg_host}:5432"
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-db
                secretKey: password
                maxConns: 20
                maxIdleConns: 20
    web:
      enabled: true
