# An OpenBao outside the cluster validates service account tokens by calling
# this cluster's TokenReview API with the token below.
# scripts/configure-openbao.sh (MODE=external) reads it once to register the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: openbao-auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-token-reviewer
  namespace: openbao-auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-token-reviewer
    namespace: openbao-auth
---
apiVersion: v1
kind: Secret
metadata:
  name: openbao-token-reviewer
  namespace: openbao-auth
  annotations:
    kubernetes.io/service-account.name: openbao-token-reviewer
type: kubernetes.io/service-account-token
